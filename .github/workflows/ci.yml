name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Validate · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pin the build runtime so a release is reproducible from its lockfile.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest + package allow-list
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Unit tests + i18n key parity
        run: npm test

  build:
    name: Build store package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=weft-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack extension zip
        run: npm run pack

      - name: Verify zip contents
        run: |
          echo "=== Package contents ==="
          unzip -l "${{ steps.meta.outputs.zip }}" | tee contents.txt
          # scripts/package-files.mjs is an allow-list, so dev files cannot be
          # packed in the first place. This is the belt-and-braces check on the
          # produced artifact. YAML block scalars pass backslashes through
          # verbatim, so these must be single-escaped — '\\.' would ask ERE for
          # a literal backslash and silently match nothing.
          ! grep -E 'node_modules/|\.github/|test/|scripts/|eslint\.config\.js|package\.json' contents.txt \
            || { echo "Dev-only file leaked into store package"; exit 1; }
          # Core runtime files and the licence must be present.
          for required in manifest.json background.js chat.html LICENSE; do
            grep -q "$required" contents.txt \
              || { echo "Missing from store package: $required"; exit 1; }
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weft-extension-v${{ steps.meta.outputs.version }}
          path: weft-*.zip
          retention-days: 30
          if-no-files-found: error
