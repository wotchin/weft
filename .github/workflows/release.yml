name: Release

# Triggered when a version tag (v3.0.1, v3.0.1-rc.1, ...) is pushed.
# Builds the store zip, publishes to the Chrome Web Store, and creates a
# GitHub Release with the zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Build · Publish to Chrome Web Store · GitHub Release
    runs-on: ubuntu-latest
    # Guard against accidental releases from non-upstream forks.
    if: github.repository == '${{ github.repository }}'

    steps:
      - uses: actions/checkout@v4

      - name: Read metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=weft-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$(grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-' <<< "$TAG" && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Gate — lint + test + validate manifest
        run: npm run check

      - name: Pack store zip
        run: npm run pack

      # Upload first so a failed store publish still leaves a usable zip in
      # the GitHub release — users can sideload while we recover.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Weft v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          files: ${{ steps.meta.outputs.zip }}

      - name: Publish to Chrome Web Store
        # Skipped when the maintainer has not stored publish credentials;
        # the GitHub Release above is still produced so the build is not lost.
        if: ${{ vars.CHROME_EXTENSION_ID != '' }}
        uses: wdzeng/chrome-extension@v3
        with:
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          zip-path: ${{ steps.meta.outputs.zip }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
