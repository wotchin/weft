<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; background: transparent; }
        #container { width: 100%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="lib/vendor/mermaid.min.js"></script>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'strict',
            htmlLabels: false,
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            flowchart: { useMaxWidth: true, htmlLabels: false },
            mindmap: { useMaxWidth: true },
            sequence: { useMaxWidth: true },
        });

        let renderCounter = 0;
        const parentWindow = window.parent;

        function sendToParent(message) {
            if (parentWindow !== window) parentWindow.postMessage(message, '*');
        }

        /**
         * Mermaid emits most diagram colours in a <style> block and class
         * selectors. The parent page intentionally removes both from untrusted
         * SVG, so snapshot the resolved paint/text styles as presentation
         * attributes while the SVG is still inside this isolated renderer.
         */
        function inlineSvgPresentation(root) {
            if (!root || typeof root.querySelectorAll !== 'function') return '';
            const paintProperties = [
                ['fill', 'fill'],
                ['fill-opacity', 'fill-opacity'],
                ['stroke', 'stroke'],
                ['stroke-width', 'stroke-width'],
                ['stroke-linecap', 'stroke-linecap'],
                ['stroke-linejoin', 'stroke-linejoin'],
                ['stroke-dasharray', 'stroke-dasharray'],
                ['stroke-opacity', 'stroke-opacity'],
                ['opacity', 'opacity'],
            ];
            const textProperties = [
                ...paintProperties,
                ['font-family', 'font-family'],
                ['font-size', 'font-size'],
                ['font-weight', 'font-weight'],
                ['text-anchor', 'text-anchor'],
                ['dominant-baseline', 'dominant-baseline'],
            ];
            const tspanProperties = textProperties
                .filter(([, attributeName]) => attributeName !== 'text-anchor');
            const stopProperties = [
                ['opacity', 'opacity'],
                ['stop-color', 'stop-color'],
                ['stop-opacity', 'stop-opacity'],
            ];
            const paintTags = new Set([
                'path', 'rect', 'circle', 'ellipse', 'line', 'polyline',
                'polygon', 'text', 'tspan', 'stop',
            ]);
            const nodes = Array.from(root.querySelectorAll('*'))
                .filter((node) => paintTags.has(String(node.localName || '').toLowerCase()));
            // Read every computed style before writing attributes, so one
            // mutation cannot influence a later descendant's snapshot.
            const snapshots = nodes.map((node) => {
                const computed = window.getComputedStyle(node);
                const tag = String(node.localName || '').toLowerCase();
                const properties = tag === 'text'
                    ? textProperties
                    : tag === 'tspan' ? tspanProperties
                    : tag === 'stop' ? stopProperties : paintProperties;
                const rootMindmapLabel = tag === 'text'
                    && node.closest?.('.mindmap-node.section-root');
                return {
                    node,
                    values: properties.map(([cssName, attributeName]) => [
                        attributeName,
                        rootMindmapLabel && attributeName === 'text-anchor'
                            ? 'middle'
                            : computed.getPropertyValue(cssName).trim(),
                    ]),
                };
            });
            for (const { node, values } of snapshots) {
                for (const [name, value] of values) {
                    if (value) node.setAttribute(name, value);
                }
            }
            return root.outerHTML || '';
        }

        window.addEventListener('message', async (event) => {
            if (event.source !== parentWindow || !event.data) return;

            const requestId = typeof event.data.requestId === 'string'
                ? event.data.requestId
                : '';
            if (event.data.type === 'mermaid-ping') {
                sendToParent({ type: 'mermaid-ready', requestId });
                return;
            }

            if (event.data.type === 'render-mermaid') {
                const code = typeof event.data.code === 'string' ? event.data.code : '';
                const safeCode = `---
config:
  htmlLabels: false
  flowchart:
    htmlLabels: false
---
${code}`;
                const container = document.getElementById('container');
                container.innerHTML = '';

                try {
                    const id = `mermaid-${++renderCounter}`;
                    const { svg } = await mermaid.render(id, safeCode);
                    container.innerHTML = svg;
                    const renderedRoot = container.querySelector('svg');
                    const renderedSvg = inlineSvgPresentation(renderedRoot);
                    if (!renderedSvg) throw new Error('Mermaid returned an empty SVG.');
                    sendToParent({
                        type: 'mermaid-result',
                        requestId,
                        svg: renderedSvg,
                    });
                } catch (err) {
                    sendToParent({
                        type: 'mermaid-result',
                        requestId,
                        error: err.message || 'Mermaid rendering failed',
                    });
                }
            }
        });

        // Signal ready
        sendToParent({ type: 'mermaid-ready' });
    </script>
</body>
</html>
