<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Assistant</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="sp-container">
        <!-- Header -->
        <div class="sp-header">
            <div class="sp-header-left">
                <span class="sp-logo">CA</span>
                <span class="sp-title">Cyber Assistant</span>
            </div>
            <div class="sp-header-right">
                <label class="sp-auto-toggle" title="Auto-capture page summaries as you browse">
                    <input type="checkbox" id="autoCapture">
                    <span class="sp-toggle-label">Auto</span>
                </label>
                <button id="openPopup" class="sp-icon-btn" title="Open full popup">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </button>
            </div>
        </div>

        <!-- Session selector -->
        <div class="sp-session-bar">
            <select id="sessionSelect" class="sp-session-select"></select>
            <span class="sp-snippet-count" id="snippetCount">0</span>
        </div>

        <!-- Current page card -->
        <div class="sp-section">
            <div class="sp-section-header">
                <span class="sp-section-title">Current Page</span>
                <button id="refreshPage" class="sp-small-btn" title="Refresh page info">Refresh</button>
            </div>
            <div class="sp-page-card" id="pageCard">
                <div class="sp-page-loading">Analyzing page...</div>
            </div>
        </div>

        <!-- Quick actions -->
        <div class="sp-actions">
            <button id="saveSummary" class="sp-action-btn primary" title="Save page summary to session">
                Save to Session
            </button>
            <button id="aiSummary" class="sp-action-btn ai" title="Generate AI-powered summary">
                AI Summary
            </button>
        </div>

        <!-- Key terms (extracted from page) -->
        <div class="sp-section" id="keyTermsSection" style="display:none;">
            <div class="sp-section-header">
                <span class="sp-section-title">Key Terms</span>
            </div>
            <div class="sp-terms" id="keyTerms"></div>
        </div>

        <!-- Session snippets (compact list) -->
        <div class="sp-section">
            <div class="sp-section-header">
                <span class="sp-section-title">Session Snippets</span>
                <button id="openChat" class="sp-small-btn">Chat</button>
                <button id="openGraph" class="sp-small-btn">Graph</button>
            </div>
            <div class="sp-snippets" id="snippetList">
                <div class="sp-empty">No snippets yet</div>
            </div>
        </div>

        <!-- Related pages from session -->
        <div class="sp-section" id="relatedSection" style="display:none;">
            <div class="sp-section-header">
                <span class="sp-section-title">Related in Session</span>
            </div>
            <div class="sp-related" id="relatedList"></div>
        </div>
    </div>

    <script src="lib/tokenizer.js"></script>
    <script src="lib/snippet-organizer.js"></script>
    <script src="lib/graph-builder.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
