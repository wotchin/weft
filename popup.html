<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weft</title>
  <link rel="stylesheet" href="styles.css?v=3.0.1-ui2">
</head>
<body>
  <div id="content">
    <div class="header">
      <div class="brand">
        <img class="brand-mark" src="assets/icon-32.png" alt="">
        <div class="brand-copy">
          <h1 class="app-title">Weft</h1>
          <span class="app-kicker">Research workspace</span>
        </div>
      </div>
      <button id="openSettings" class="icon-btn" title="Settings" data-i18n-title="popup_settings">
        <img src="assets/others/settings.svg" alt="">
      </button>
    </div>

    <div class="session-controls">
      <div class="session-row">
        <img class="session-icon" src="assets/others/snapshots.svg" alt="">
        <select id="sessionSelect" class="session-select" title="Active session" data-i18n-title="popup_active_session"></select>
      </div>
      <div class="session-meta" id="sessionMeta"></div>
    </div>

    <div id="recentList" class="recent-list"></div>

    <div class="bottom-bar">
      <div class="bottom-bar-row">
        <button id="openChat" class="action-btn primary">
          <span class="asset-mask asset-branching" aria-hidden="true"></span>
          <span data-i18n="popup_open_workbench">Open Workbench</span>
        </button>
        <button id="showOnPage" class="action-btn secondary" title="Highlight this session's snippets on the current page">
          <span class="asset-mask asset-snapshots" aria-hidden="true"></span>
          <span id="showOnPageLabel" data-i18n="popup_show_on_page">Show on Page</span>
        </button>
      </div>
      <div class="popup-hint" data-i18n="popup_hint">
        Select text on any page, then right-click to save it here.
      </div>
    </div>
  </div>

  <script src="lib/idb.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
