<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weft</title>
  <link rel="stylesheet" href="styles.css?v=3.0.2-ui3">
</head>
<body>
  <div id="content">
    <div class="header">
      <div class="brand">
        <img class="brand-mark" src="assets/icon.svg" alt="">
        <div class="brand-copy">
          <h1 class="app-title">Weft</h1>
          <span class="app-kicker" data-i18n="popup_kicker">Research workspace</span>
        </div>
      </div>
      <button id="openSettings" class="icon-btn" title="Settings" data-i18n-title="popup_settings" data-i18n-aria-label="popup_settings">
        <span class="asset-mask asset-settings" aria-hidden="true"></span>
      </button>
    </div>

    <div class="session-controls">
      <div class="session-row">
        <span class="asset-mask asset-snapshots session-icon" aria-hidden="true"></span>
        <select id="sessionSelect" class="session-select" title="Active session" data-i18n-title="popup_active_session" data-i18n-aria-label="popup_active_session"></select>
      </div>
      <div class="session-meta" id="sessionMeta"></div>
    </div>

    <div id="recentList" class="recent-list"></div>

    <div class="bottom-bar">
      <button id="smartRead" class="smart-read-launcher" title="Create a new focused session containing key evidence from this page" data-i18n-title="wb_smart_read_hint">
        <span class="asset-mask asset-takeaways" aria-hidden="true"></span>
        <span data-i18n="popup_smart_read">Smart Read This Page</span>
      </button>
      <div class="bottom-bar-row">
        <button id="openChat" class="action-btn primary">
          <span class="asset-mask asset-open" aria-hidden="true"></span>
          <span data-i18n="popup_open_workbench">Open Workbench</span>
        </button>
        <button id="showOnPage" class="action-btn secondary" title="Highlight snippets on this page" data-i18n-title="wb_show_on_page" aria-pressed="false">
          <span class="asset-mask asset-eye" aria-hidden="true"></span>
          <span id="showOnPageLabel" data-i18n="popup_show_on_page">Show on Page</span>
        </button>
      </div>
      <div class="popup-hint" data-i18n="popup_hint">
        Select text on any page, then right-click to save it here.
      </div>
    </div>

    <footer class="weft-footer" id="weftFooter"></footer>
  </div>

  <script src="lib/idb.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/source-utils.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
